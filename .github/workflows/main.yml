name: Build Rasmi APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Rasmi-Android-GitHub-Actions.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Android project ZIP
        run: |
          unzip -q Rasmi-Android-GitHub-Actions.zip -d source
          test -f source/rasmi-android-project/settings.gradle
          test -f source/rasmi-android-project/app/src/main/assets/index.html

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon -p source/rasmi-android-project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rasmi-debug-APK
          path: source/rasmi-android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
